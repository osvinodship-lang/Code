<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #999;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #ff6b6b;
            color: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #ff5252;
        }

        .weather-info {
            color: white;
            text-align: center;
        }

        .city-name {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .weather-description {
            font-size: 1.2em;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        .temp-main {
            font-size: 3em;
            font-weight: bold;
            margin: 20px 0;
        }

        .temp-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .detail-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            font-size: 1.1em;
            padding: 20px;
            background: rgba(255, 107, 107, 0.2);
            border-radius: 8px;
            display: none;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            display: none;
        }

        .weather-icon {
            font-size: 4em;
            margin: 10px 0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .temp-main {
                font-size: 2.5em;
            }

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather App</h1>
        
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                onkeypress="handleKeyPress(event)"
            >
            <button onclick="searchWeather()">Search</button>
        </div>

        <div class="loading" id="loading">Loading weather data...</div>
        <div class="error" id="error"></div>
        <div class="weather-info" id="weatherInfo"></div>
    </div>

    <script>
        // Using Open-Meteo API (free, no API key required)
        async function getCoordinates(city) {
            try {
                const response = await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=en&format=json`
                );
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    return data.results[0];
                } else {
                    throw new Error('City not found');
                }
            } catch (error) {
                throw new Error('Error fetching city coordinates');
            }
        }

        async function getWeather(latitude, longitude) {
            try {
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&temperature_unit=celsius`
                );
                const data = await response.json();
                return data.current;
            } catch (error) {
                throw new Error('Error fetching weather data');
            }
        }

        function getWeatherIcon(weatherCode) {
            // WMO Weather interpretation codes
            if (weatherCode === 0) return '☀️'; // Clear
            if (weatherCode === 1 || weatherCode === 2) return '⛅'; // Partly cloudy
            if (weatherCode === 3) return '☁️'; // Overcast
            if (weatherCode === 45 || weatherCode === 48) return '🌫️'; // Foggy
            if (weatherCode === 51 || weatherCode === 53 || weatherCode === 55) return '🌧️'; // Drizzle
            if (weatherCode === 61 || weatherCode === 63 || weatherCode === 65) return '🌧️'; // Rain
            if (weatherCode === 71 || weatherCode === 73 || weatherCode === 75) return '❄️'; // Snow
            if (weatherCode === 80 || weatherCode === 81 || weatherCode === 82) return '⛈️'; // Rain showers
            if (weatherCode === 85 || weatherCode === 86) return '❄️'; // Snow showers
            if (weatherCode === 95 || weatherCode === 96 || weatherCode === 99) return '⛈️'; // Thunderstorm
            return '🌤️';
        }

        function getWeatherDescription(weatherCode) {
            if (weatherCode === 0) return 'Clear sky';
            if (weatherCode === 1) return 'Mainly clear';
            if (weatherCode === 2) return 'Partly cloudy';
            if (weatherCode === 3) return 'Overcast';
            if (weatherCode === 45 || weatherCode === 48) return 'Foggy';
            if (weatherCode === 51 || weatherCode === 53 || weatherCode === 55) return 'Drizzle';
            if (weatherCode === 61 || weatherCode === 63 || weatherCode === 65) return 'Rainy';
            if (weatherCode === 71 || weatherCode === 73 || weatherCode === 75) return 'Snowy';
            if (weatherCode === 80 || weatherCode === 81 || weatherCode === 82) return 'Rain showers';
            if (weatherCode === 85 || weatherCode === 86) return 'Snow showers';
            if (weatherCode === 95 || weatherCode === 96 || weatherCode === 99) return 'Thunderstorm';
            return 'Unknown';
        }

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            showLoading(true);
            clearError();

            try {
                const cityData = await getCoordinates(city);
                const weather = await getWeather(cityData.latitude, cityData.longitude);

                displayWeather(cityData, weather);
            } catch (error) {
                showError(error.message || 'Error fetching weather data');
                document.getElementById('weatherInfo').innerHTML = '';
            } finally {
                showLoading(false);
            }
        }

        function displayWeather(cityData, weather) {
            const icon = getWeatherIcon(weather.weather_code);
            const description = getWeatherDescription(weather.weather_code);
            const country = cityData.country || '';

            const html = `
                <div class="city-name">${cityData.name}, ${country}</div>
                <div class="weather-icon">${icon}</div>
                <div class="weather-description">${description}</div>
                <div class="temp-main">${Math.round(weather.temperature_2m)}°C</div>
                <div class="temp-details">
                    <div class="detail-item">
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value">${Math.round(weather.temperature_2m)}°C</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value">${weather.relative_humidity_2m}%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value">${Math.round(weather.wind_speed_10m)} km/h</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Coordinates</div>
                        <div class="detail-value">${cityData.latitude.toFixed(2)}°N, ${cityData.longitude.toFixed(2)}°E</div>
                    </div>
                </div>
            `;

            document.getElementById('weatherInfo').innerHTML = html;
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function clearError() {
            document.getElementById('error').style.display = 'none';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchWeather();
            }
        }

        // Load weather for default city on page load
        window.addEventListener('load', () => {
            document.getElementById('cityInput').value = 'London';
            searchWeather();
        });
    </script>
</body>
</html>
